<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" fill="none">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070A0F"/>
      <stop offset="60%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#0A1124"/>
    </linearGradient>
    <linearGradient id="seaGrad" x1="0" y1="480" x2="0" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#071E3D"/>
      <stop offset="40%" stop-color="#0B1528"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="orangeAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <pattern id="portGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Sky & Background -->
  <rect width="1200" height="675" fill="url(#skyGrad)"/>
  <rect width="1200" height="480" fill="url(#portGrid)"/>

  <!-- Distant Port Skyline & Horizon Fog -->
  <ellipse cx="600" cy="480" rx="650" ry="80" fill="#0EA5E9" opacity="0.08"/>
  <ellipse cx="900" cy="420" rx="300" ry="120" fill="#22D3EE" opacity="0.05"/>

  <!-- Water Surface -->
  <rect y="480" width="1200" height="195" fill="url(#seaGrad)"/>
  <line x1="0" y1="480" x2="1200" y2="480" stroke="#22D3EE" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Water Reflections -->
  <g opacity="0.25">
    <line x1="180" y1="500" x2="380" y2="500" stroke="#22D3EE" stroke-width="2" stroke-dasharray="20 10"/>
    <line x1="140" y1="520" x2="420" y2="520" stroke="#22D3EE" stroke-width="1.5" stroke-dasharray="15 15"/>
    <line x1="600" y1="495" x2="850" y2="495" stroke="#F97316" stroke-width="2" stroke-dasharray="30 15"/>
    <line x1="640" y1="515" x2="800" y2="515" stroke="#F97316" stroke-width="1" stroke-dasharray="10 20"/>
    <line x1="220" y1="550" x2="340" y2="550" stroke="#22D3EE" stroke-width="1" stroke-dasharray="8 8"/>
    <line x1="700" y1="540" x2="900" y2="540" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="25 10"/>
  </g>

  <!-- Left Quayside Dock Barrier -->
  <polygon points="0,480 460,480 430,510 0,510" fill="#1E293B" opacity="0.8"/>
  <line x1="0" y1="482" x2="455" y2="482" stroke="#F97316" stroke-width="3"/>

  <!-- Container Ship Hull at Berth (Right side) -->
  <g id="freighter-ship">
    <!-- Ship Hull -->
    <path d="M 520 480 L 560 400 L 1160 400 L 1200 480 Z" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <!-- Red Antifouling Lower Hull reflection line -->
    <path d="M 520 480 L 1200 480 L 1200 492 L 530 492 Z" fill="#DC2626" opacity="0.7"/>
    <!-- Ship Bridge Superstructure -->
    <rect x="1040" y="270" width="100" height="130" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
    <rect x="1060" y="240" width="60" height="30" fill="#334155"/>
    <line x1="1090" y1="210" x2="1090" y2="240" stroke="#94A3B8" stroke-width="2"/>
    <circle cx="1090" cy="208" r="4" fill="#22D3EE"/>
    <!-- Radar mast light -->
    <circle cx="1090" cy="208" r="9" stroke="#22D3EE" stroke-width="1" opacity="0.4"/>
    <!-- Bridge Windows -->
    <rect x="1055" y="280" width="70" height="10" fill="#38BDF8" opacity="0.75"/>
    <!-- Ship Stack & Smoke Plume hint -->
    <rect x="1105" y="245" width="18" height="25" fill="#F97316"/>
  </g>

  <!-- Onboard Containers (Layered Stack on the Ship) -->
  <g id="ship-containers">
    <!-- Row 1 -->
    <rect x="580" y="365" width="85" height="35" rx="2" fill="#0284C7" stroke="#0369A1" stroke-width="1.5"/>
    <rect x="670" y="365" width="85" height="35" rx="2" fill="#EA580C" stroke="#C2410C" stroke-width="1.5"/>
    <rect x="760" y="365" width="85" height="35" rx="2" fill="#0D9488" stroke="#0F766E" stroke-width="1.5"/>
    <rect x="850" y="365" width="85" height="35" rx="2" fill="#2563EB" stroke="#1D4ED8" stroke-width="1.5"/>
    <rect x="940" y="365" width="85" height="35" rx="2" fill="#475569" stroke="#334155" stroke-width="1.5"/>
    <!-- Row 2 -->
    <rect x="590" y="328" width="85" height="35" rx="2" fill="#334155" stroke="#1E293B" stroke-width="1.5"/>
    <rect x="680" y="328" width="85" height="35" rx="2" fill="#0284C7" stroke="#0369A1" stroke-width="1.5"/>
    <rect x="770" y="328" width="85" height="35" rx="2" fill="#EA580C" stroke="#C2410C" stroke-width="1.5"/>
    <rect x="860" y="328" width="85" height="35" rx="2" fill="#0D9488" stroke="#0F766E" stroke-width="1.5"/>
    <rect x="950" y="328" width="75" height="35" rx="2" fill="#2563EB" stroke="#1D4ED8" stroke-width="1.5"/>
    <!-- Row 3 -->
    <rect x="690" y="291" width="85" height="35" rx="2" fill="#2563EB" stroke="#1D4ED8" stroke-width="1.5"/>
    <rect x="780" y="291" width="85" height="35" rx="2" fill="#334155" stroke="#1E293B" stroke-width="1.5"/>
    <rect x="870" y="291" width="85" height="35" rx="2" fill="#EA580C" stroke="#C2410C" stroke-width="1.5"/>
  </g>

  <!-- Port Quay Yard Containers (Left foreground) -->
  <g id="quay-containers">
    <!-- Stack 1 -->
    <rect x="40" y="420" width="110" height="45" rx="2" fill="#0369A1" stroke="#38BDF8" stroke-width="1"/>
    <rect x="40" y="372" width="110" height="45" rx="2" fill="#C2410C" stroke="#FB923C" stroke-width="1"/>
    <rect x="40" y="324" width="110" height="45" rx="2" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <line x1="75" y1="372" x2="75" y2="417" stroke="#075985" stroke-width="1"/>
    <line x1="110" y1="372" x2="110" y2="417" stroke="#075985" stroke-width="1"/>
    <!-- Stack 2 -->
    <rect x="160" y="420" width="110" height="45" rx="2" fill="#0F766E" stroke="#2DD4BF" stroke-width="1"/>
    <rect x="160" y="372" width="110" height="45" rx="2" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <!-- Stack 3 -->
    <rect x="280" y="420" width="110" height="45" rx="2" fill="#C2410C" stroke="#FB923C" stroke-width="1"/>
    <rect x="280" y="372" width="110" height="45" rx="2" fill="#0284C7" stroke="#38BDF8" stroke-width="1"/>
    <rect x="280" y="324" width="110" height="45" rx="2" fill="#0F766E" stroke="#2DD4BF" stroke-width="1"/>
  </g>

  <!-- Giant STS (Ship-to-Shore) Container Crane -->
  <g id="sts-crane" stroke="#94A3B8" stroke-width="3" stroke-linecap="round">
    <!-- Crane Tower Legs -->
    <line x1="390" y1="480" x2="430" y2="170"/>
    <line x1="470" y1="480" x2="450" y2="170"/>
    <!-- Cross Bracing -->
    <line x1="395" y1="440" x2="465" y2="410" stroke-width="2"/>
    <line x1="405" y1="380" x2="460" y2="350" stroke-width="2"/>
    <line x1="415" y1="310" x2="455" y2="280" stroke-width="2"/>
    <line x1="422" y1="240" x2="452" y2="210" stroke-width="2"/>
    <!-- Crane Boom / Horizontal Girder extending over ship -->
    <line x1="320" y1="170" x2="880" y2="170" stroke="#F97316" stroke-width="5"/>
    <line x1="320" y1="150" x2="880" y2="150" stroke="#F97316" stroke-width="3"/>
    <!-- Boom Truss Diagonal Support -->
    <line x1="440" y1="70" x2="350" y2="150" stroke="#EA580C" stroke-width="2.5"/>
    <line x1="440" y1="70" x2="680" y2="150" stroke="#EA580C" stroke-width="2.5"/>
    <line x1="440" y1="70" x2="860" y2="150" stroke="#EA580C" stroke-width="2.5"/>
    <!-- Crane Apex Structure -->
    <polygon points="420,170 440,70 460,170" fill="#1E293B" stroke="#F97316" stroke-width="2"/>
    <!-- Warning Light on Crane Top -->
    <circle cx="440" cy="65" r="4" fill="#EF4444"/>
    <!-- Trolley & Spreader Hoist -->
    <rect x="620" y="166" width="30" height="14" fill="#38BDF8"/>
    <line x1="627" y1="180" x2="627" y2="260" stroke="#E2E8F0" stroke-width="1.5"/>
    <line x1="643" y1="180" x2="643" y2="260" stroke="#E2E8F0" stroke-width="1.5"/>
    <!-- Lifted Container in mid-air -->
    <rect x="610" y="260" width="50" height="22" rx="2" fill="#22D3EE" stroke="#0891B2" stroke-width="1.5"/>
  </g>

  <!-- Secondary Background Crane (Distance) -->
  <g id="secondary-crane" stroke="#334155" stroke-width="2" opacity="0.6">
    <line x1="780" y1="400" x2="810" y2="190"/>
    <line x1="840" y1="400" x2="825" y2="190"/>
    <line x1="720" y1="190" x2="1080" y2="190" stroke="#475569" stroke-width="3"/>
    <polygon points="805,190 817,110 830,190" fill="none" stroke="#475569" stroke-width="1.5"/>
    <line x1="817" y1="110" x2="740" y2="190"/>
    <line x1="817" y1="110" x2="980" y2="190"/>
    <circle cx="817" cy="108" r="3" fill="#EF4444"/>
  </g>

  <!-- Flight / Route Vector Connecting Corridors -->
  <path d="M 120 400 Q 400 120 720 180 T 1150 140" fill="none" stroke="url(#cyanAccent)" stroke-width="2" stroke-dasharray="6 6" opacity="0.75"/>
  <circle cx="120" cy="400" r="5" fill="#22D3EE"/>
  <circle cx="120" cy="400" r="12" stroke="#22D3EE" stroke-width="1" opacity="0.4"/>

  <!-- Telemetry & Brand Overlay Badges -->
  <g transform="translate(60, 60)">
    <!-- Container Badge -->
    <rect width="320" height="66" rx="8" fill="#0B132B" fill-opacity="0.85" stroke="#1E293B" stroke-width="1.5"/>
    <circle cx="28" cy="33" r="10" fill="#22D3EE" fill-opacity="0.15"/>
    <circle cx="28" cy="33" r="5" fill="#22D3EE"/>
    <text x="50" y="28" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="13" letter-spacing="1.5">GLOBAL PORT TERMINAL</text>
    <text x="50" y="47" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11" letter-spacing="0.5">OCEAN LINEHAUL • DESTINATION DISPATCH</text>
  </g>

  <g transform="translate(860, 60)">
    <rect width="280" height="66" rx="8" fill="#0B132B" fill-opacity="0.85" stroke="#1E293B" stroke-width="1.5"/>
    <text x="24" y="28" fill="#38BDF8" font-family="monospace" font-weight="600" font-size="12" letter-spacing="1">VESSEL BERTH STATUS: ACTIVE</text>
    <text x="24" y="47" fill="#64748B" font-family="monospace" font-size="11">PAKISTAN EXPORT CORRIDORS</text>
  </g>

  <!-- Bottom Brand Watermark -->
  <text x="600" y="635" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="3" opacity="0.8">RAAHI INTERNATIONAL • COMMERCIAL MARITIME &amp; CONTAINER LOGISTICS</text>
</svg>
